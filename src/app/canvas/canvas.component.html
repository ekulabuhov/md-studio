<canvas #canvas></canvas>
<div style="position: absolute; bottom: 0px; background-color: bisque">
  {{ xCoord }}x{{ yCoord }}
  <div>{{ Math.floor(xCoord / 8) }}x{{ Math.floor(yCoord / 8) }}</div>
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      [(ngModel)]="clipViewport"
      (ngModelChange)="onClipViewportChange()"
      id="clipViewportCheck"
    />
    <label class="form-check-label" for="clipViewportCheck">
      Clip viewport
    </label>
  </div>
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      [(ngModel)]="drawGrid"
      id="drawGridCheck"
    />
    <label class="form-check-label" for="drawGridCheck"> Draw grid </label>
  </div>
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      [(ngModel)]="shouldAnimate"
      id="shouldAnimateCheck"
    />
    <label class="form-check-label" for="shouldAnimateCheck"> Animate? </label>
  </div>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="onPlayClick()"
  >
    Play
  </button>
  <span>{{ mouseMode }}</span>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="onReloadScriptsClick()"
  >
    Reload Scripts
  </button>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="onCompileRomClick()"
  >
    Compile ROM
  </button>
</div>
